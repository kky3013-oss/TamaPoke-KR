name: Build Korean TamaPoke ESP32-S3

on:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-22.04
    timeout-minutes: 30
    steps:
      - name: Checkout source
        uses: actions/checkout@v5

      - name: Verify Korean source
        run: |
          set -eux
          test -f TamaPoke.ino
          test -f i18n.h
          test -f i18n.cpp
          test -f kr_text.h
          test -f kr_text.cpp
          test -f kr_keyboard.h
          test -f kr_keyboard.cpp
          grep -q 'krTextBegin' TamaPoke.ino
          grep -q 'krKeyboardBegin' TamaPoke.ino

      - name: Install Arduino CLI
        uses: arduino/setup-arduino-cli@v2

      - name: Install ESP32 Arduino core
        run: |
          set -eux
          arduino-cli config init
          arduino-cli config set board_manager.additional_urls https://raw.githubusercontent.com/espressif/arduino-esp32/gh-pages/package_esp32_index.json
          arduino-cli core update-index
          arduino-cli core install esp32:esp32@3.0.7
          arduino-cli core list

      - name: Install exact library dependencies
        run: |
          set -eux
          arduino-cli lib update-index
          arduino-cli lib install 'GFX Library for Arduino@1.6.7'
          arduino-cli lib install 'SensorLib@0.4.0'
          arduino-cli lib install 'U8g2'
          arduino-cli lib list

      - name: Compile ESP32-S3
        run: |
          set -eux
          rm -rf build
          mkdir -p build
          arduino-cli compile \
            --fqbn esp32:esp32:esp32s3 \
            --output-dir build \
            --warnings all \
            .

      - name: Verify and normalize firmware artifact
        run: |
          set -eux
          find build -maxdepth 2 -type f -print
          BIN=$(find build -type f -name '*.bin' | head -n 1)
          test -n "$BIN"
          cp "$BIN" build/tamapoke.bin
          test -s build/tamapoke.bin
          ls -lh build/tamapoke.bin

      - name: Upload tamapoke.bin
        uses: actions/upload-artifact@v4
        with:
          name: tamapoke-kr-firmware
          path: build/tamapoke.bin
          if-no-files-found: error
