name: Build TamaPoke-KR

on:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: read

env:
  ARDUINO_CLI_VERSION: latest

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Arduino CLI
        uses: arduino/setup-arduino-cli@v2

      - name: Configure ESP32
        run: |
          arduino-cli config init
          arduino-cli config set board_manager.additional_urls https://raw.githubusercontent.com/espressif/arduino-esp32/gh-pages/package_esp32_index.json
          arduino-cli core update-index
          arduino-cli core install esp32:esp32

      - name: Install libraries
        run: |
          arduino-cli lib update-index
          arduino-cli lib install "GFX Library for Arduino"
          arduino-cli lib install "SensorLib"
          arduino-cli lib install "U8g2"

      - name: Normalize Korean initialization
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path('TamaPoke.ino')
          s = p.read_text(encoding='utf-8')
          marker = '  if (!gfx->begin(80000000)) Serial.println("gfx->begin() fallo");'
          end_marker = '  panel->setBrightness(180);'
          if marker in s and end_marker in s:
              start = s.index(marker) + len(marker)
              end = s.index(end_marker, start)
              s = s[:start] + '\n  krTextBegin();\n  krKeyboardBegin();\n' + s[end:]
              p.write_text(s, encoding='utf-8')
          else:
              print('Initialization markers not found; leaving source unchanged.')
          PY

      - name: Check sketch
        run: |
          test -f TamaPoke.ino
          grep -q 'krTextBegin' TamaPoke.ino
          grep -q 'krKeyboardBegin' TamaPoke.ino

      - name: Compile ESP32-S3 firmware
        run: |
          mkdir -p build
          arduino-cli compile --fqbn esp32:esp32:esp32s3 . --output-dir build --warnings all

      - name: Verify firmware
        run: |
          echo 'Build output:'
          find build -maxdepth 2 -type f -print
          test -f build/TamaPoke.ino.bin
          cp build/TamaPoke.ino.bin build/tamapoke.bin
          test -s build/tamapoke.bin
          ls -lh build/tamapoke.bin

      - name: Upload firmware
        uses: actions/upload-artifact@v4
        with:
          name: tamapoke-kr-firmware
          path: build/tamapoke.bin
          if-no-files-found: error
