name: Build TamaPoke-KR

on:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Arduino CLI
        uses: arduino/setup-arduino-cli@v2

      - name: Configure ESP32-S3 toolchain
        run: |
          arduino-cli config init
          arduino-cli config set board_manager.additional_urls https://raw.githubusercontent.com/espressif/arduino-esp32/gh-pages/package_esp32_index.json
          arduino-cli core update-index
          arduino-cli core install esp32:esp32@3.0.7
          arduino-cli version

      - name: Install required libraries
        run: |
          arduino-cli lib update-index
          arduino-cli lib install "GFX Library for Arduino@1.6.7"
          arduino-cli lib install "SensorLib@0.4.0"
          arduino-cli lib install "U8g2@2.36.5"
          arduino-cli lib list

      - name: Normalize source before compile
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path('TamaPoke.ino')
          s = p.read_text(encoding='utf-8')
          # The source was edited repeatedly during development. Keep exactly
          # one Korean text/keyboard initialization pair after gfx->begin().
          marker = '  if (!gfx->begin(80000000)) Serial.println("gfx->begin() fallo");'
          if marker in s:
              start = s.index(marker) + len(marker)
              end_marker = '  panel->setBrightness(180);'
              if end_marker in s[start:]:
                  end = start + s[start:].index(end_marker)
                  replacement = '\n  krTextBegin();\n  krKeyboardBegin();\n'
                  s = s[:start] + replacement + s[end:]
          p.write_text(s, encoding='utf-8')
          PY

      - name: Verify Korean source
        run: |
          test -f TamaPoke.ino
          test -f kr_text.cpp
          test -f kr_keyboard.cpp
          grep -q 'krTextBegin' TamaPoke.ino
          grep -q 'krKeyboardBegin' TamaPoke.ino
          grep -q 'u8g2_font_unifont_h_cjk' kr_text.cpp

      - name: Compile ESP32-S3 firmware
        run: |
          rm -rf build
          mkdir -p build
          set -o pipefail
          arduino-cli compile \
            --fqbn esp32:esp32:esp32s3 \
            --build-path build \
            --warnings all \
            . 2>&1 | tee build/compile.log

      - name: Verify firmware
        run: |
          echo 'Build output:'
          find build -maxdepth 2 -type f -print
          BIN=$(find build -type f -name '*.bin' ! -name 'tamapoke.bin' | head -1)
          test -n "$BIN"
          cp "$BIN" build/tamapoke.bin
          test -s build/tamapoke.bin
          ls -lh build/tamapoke.bin

      - name: Upload firmware
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: tamapoke-kr-firmware
          path: build/tamapoke.bin
          if-no-files-found: error

      - name: Upload compile log on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: tamapoke-kr-build-log
          path: build/compile.log
          if-no-files-found: ignore
